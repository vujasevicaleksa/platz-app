<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLATZ | powered by PETROLISTA.</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --platz-yellow: #f8e110; --platz-black: #000000; --pure-white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--platz-yellow); color: var(--platz-black); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .platz-header { display: flex; justify-content: center; align-items: center; padding: 40px 20px; border-bottom: 8px solid var(--platz-black); background-color: var(--platz-yellow); }
        .header-content { display: flex; align-items: center; gap: 30px; }
        .header-text { display: flex; flex-direction: column; align-items: flex-end; }
        .header-text h1 { font-family: 'Oswald', sans-serif; font-size: 6rem; line-height: 0.9; letter-spacing: -2px; text-transform: uppercase; }
        .header-text p { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
        .vertical-line { width: 8px; height: 120px; background-color: var(--platz-black); }
        .header-image { height: 120px; }
        .container { max-width: 1300px; margin: 0 auto; padding: 50px 20px; }
        .section-title { font-family: 'Oswald', sans-serif; font-size: 3rem; text-transform: uppercase; margin-bottom: 40px; display: inline-block; background-color: var(--platz-black); color: var(--platz-yellow); padding: 10px 20px; transform: skewX(-10deg); }
        .section-title span { display: inline-block; transform: skewX(10deg); }
        .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .car-card { background-color: var(--pure-white); border: 6px solid var(--platz-black); box-shadow: 12px 12px 0px var(--platz-black); display: flex; flex-direction: column; transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .car-card:hover { transform: translate(-4px, -4px); box-shadow: 16px 16px 0px var(--platz-black); }
        .car-image-wrapper { border-bottom: 6px solid var(--platz-black); height: 250px; overflow: hidden; background-color: #ddd; }
        .car-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .car-info { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .car-name { font-family: 'Oswald', sans-serif; font-size: 2rem; text-transform: uppercase; line-height: 1.1; margin-bottom: 15px; }
        .car-specs { font-size: 1rem; font-weight: 600; margin-bottom: 25px; flex-grow: 1; }
        .car-specs ul { list-style: none; }
        .car-specs li { margin-bottom: 8px; border-bottom: 2px dashed #ccc; padding-bottom: 4px; }
        .car-action { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .car-price { font-family: 'Oswald', sans-serif; font-size: 2.2rem; color: var(--platz-black); }
        .btn-view { background-color: var(--platz-black); color: var(--platz-yellow); font-family: 'Oswald', sans-serif; font-size: 1.2rem; text-decoration: none; padding: 10px 20px; text-transform: uppercase; border: 3px solid var(--platz-black); transition: all 0.2s ease; }
        .btn-view:hover { background-color: var(--platz-yellow); color: var(--platz-black); }
        .no-ads { font-size: 1.5rem; font-weight: 900; grid-column: 1 / -1; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <header class="platz-header">
        <div class="header-content">
            <div class="header-text">
                <h1>PLATZ</h1>
                <p>powered by PETROLISTA.</p>
            </div>
            <div class="vertical-line"></div>
            <img src="{{ url_for('static', filename='platz.jpg') }}" alt="Platz Logo" class="header-image">
        </div>
    </header>

    <main class="container">
        <h2 class="section-title"><span>Trenutno u ponudi</span></h2>
        <div class="listings-grid" id="listings-container">
            <p class="no-ads">Učitavanje oglasa...</p>
        </div>
    </main>

    <script>
        async function ucitajOglase() {
            try {
                const response = await fetch('/api/oglasi');
                const oglasi = await response.json();
                const container = document.getElementById('listings-container');
                container.innerHTML = '';

                if (oglasi.length === 0) {
                    container.innerHTML = '<p class="no-ads">Trenutno nema automobila na stanju.</p>';
                    return;
                }

                oglasi.forEach(auto => {
                    const card = document.createElement('article');
                    card.className = 'car-card';
                    card.innerHTML = `
                        <div class="car-image-wrapper">
                            <img src="/${auto.naslovna_slika}" alt="${auto.naziv}">
                        </div>
                        <div class="car-info">
                            <h3 class="car-name">${auto.naziv}</h3>
                            <div class="car-specs">
                                <ul>
                                    <li><strong>Godište:</strong> ${auto.godiste}</li>
                                    <li><strong>Kilometraža:</strong> ${auto.kilometraza}</li>
                                    <li><strong>Motor:</strong> ${auto.motor}</li>
                                </ul>
                            </div>
                            <div class="car-action">
                                <span class="car-price">${auto.cijena}</span>
                                <a href="/oglas/${auto.id}" class="btn-view">Detalji</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Greška pri učitavanju:", error);
            }
        }
        document.addEventListener('DOMContentLoaded', ucitajOglase);
    </script>
</body>
</html>
