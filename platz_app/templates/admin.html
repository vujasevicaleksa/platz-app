<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLATZ - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8e110; color: #000; font-family: 'Montserrat', sans-serif; padding: 40px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: white; border: 6px solid black; box-shadow: 12px 12px 0px black; padding: 30px; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 2.5rem; text-transform: uppercase; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: 900; margin-bottom: 5px; text-transform: uppercase; font-size: 0.9rem; }
        input, textarea, button { padding: 12px; border: 3px solid black; font-family: 'Montserrat', sans-serif; font-weight: 600; }
        input, textarea { background: #f9f9f9; }
        textarea { resize: vertical; height: 100px; }
        button { background: black; color: #f8e110; font-family: 'Oswald', sans-serif; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        button:hover { background: #333; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        a { color: black; font-weight: 900; text-decoration: none; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="top-bar">
            <h1>Admin Panel</h1>
            <a href="/admin/logout">Odjavi se</a>
        </div>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Naziv automobila:</label>
                <input type="text" name="naziv" placeholder="npr. Porsche 911 Carrera" required>
            </div>
            <div class="form-group">
                <label>Godište:</label>
                <input type="text" name="godiste" placeholder="npr. 2019" required>
            </div>
            <div class="form-group">
                <label>Kilometraža:</label>
                <input type="text" name="kilometraza" placeholder="npr. 45.000 km" required>
            </div>
            <div class="form-group">
                <label>Motor:</label>
                <input type="text" name="motor" placeholder="npr. 3.0L Benzin" required>
            </div>
            <div class="form-group">
                <label>Cijena:</label>
                <input type="text" name="cijena" placeholder="npr. 95.000 €" required>
            </div>
            <div class="form-group">
                <label>Glavna (naslovna) slika:</label>
                <input type="file" name="naslovna_slika" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Dodatne slike (za galeriju):</label>
                <input type="file" name="dodatne_slike" accept="image/*" multiple>
            </div>
            <div class="form-group">
                <label>Detaljni opis automobila:</label>
                <textarea name="detaljni_opis" placeholder="Unesite opširniji opis, opremu, stanje vozila..."></textarea>
            </div>
            <button type="submit">Dodaj oglas</button>

		<!-- Dodaj ovo na dno admin.html, unutar body-ja, ispod forme -->
<div class="admin-container" style="margin-top: 40px;" id="admin-lista">
    <h2 style="font-family: 'Oswald', sans-serif; font-size: 2rem; margin-bottom: 20px; text-transform: uppercase;">Aktivni oglasi</h2>
    <div id="lista-oglasa-admin">Učitavanje...</div>
</div>

<script>
    async function ucitajAdminOglase() {
        const res = await fetch('/api/oglasi');
        const oglasi = await res.json();
        const div = document.getElementById('lista-oglasa-admin');
        div.innerHTML = '';
        
        if(oglasi.length === 0) {
            div.innerHTML = '<p>Nema aktivnih oglasa.</p>';
            return;
        }

        oglasi.forEach(a => {
            div.innerHTML += `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding: 10px 0;">
                    <span><strong>${a.naziv}</strong> (${a.cijena})</span>
                    <div>
                        <a href="/oglas/${a.id}" target="_blank" style="margin-right: 10px; background: black; color: #f8e110; padding: 5px 10px; font-size: 0.8rem;">Pogledaj</a>
                        <a href="/admin/obrisi/${a.id}" onclick="return confirm('Obrisati oglas?')" style="background: red; color: white; padding: 5px 10px; font-size: 0.8rem; text-decoration:none;">Obriši</a>
                    </div>
                </div>
            `;
        });
    }
    ucitajAdminOglase();
</script>
        </form>
    </div>
</body>
</html>
